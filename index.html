<!DOCTYPE html>
<!-- data-capa: marca esta página como a capa do arquivo público. Se o blog
     estiver desligado em lifeos-config.js, assets/js/blog.js redireciona
     daqui pro painel — a raiz do site deixa de ser uma capa vazia. -->
<html lang="pt-BR" data-capa>
<head>
<meta charset="UTF-8">
<script src="assets/js/share-guard.js"></script>
<script src="assets/js/access-gate.js" data-slug="setter"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS · Arquivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon.svg">
<!-- O index é renderizado no cliente a partir de assets/js/manifest.js; um fetch do HTML
     não revela as entradas. Agentes e crawlers: ver /llms.txt e /manifest.json -->
<link rel="alternate" type="application/json" title="Índice de entradas (manifest)" href="manifest.json">
<style>
  /* ── RESET & TOKENS ─────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2ec;
    --bg-card: #faf8f4;
    --bg-hover: #ffffff;
    --ink: #1a1814;
    --ink-dim: #6b6456;
    --ink-mute: #b0a898;
    --rule: #d8d0c4;
    --gold: #c4913a;
    --gold-wash: rgba(196, 145, 58, 0.06);

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }

  html.dark {
    --bg: #14120f;
    --bg-card: #1c1a16;
    --bg-hover: #242018;
    --ink: #ede8df;
    --ink-dim: #b0a898;
    --ink-mute: #6b6456;
    --rule: #2e2a24;
    --gold: #c4913a;
    --gold-wash: rgba(196, 145, 58, 0.1);
  }

  html { background: var(--bg); color: var(--ink); font-family: 'Playfair Display', Georgia, serif; font-size: 18px; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding-bottom: 96px; transition: background 300ms var(--ease-in-out); }
  a { color: inherit; }
  em { font-style: italic; font-weight: 400; }

  /* ── AMBIENT FIELD ─────────────────────────────────── */
  .ambient-field { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .ambient-glyph {
    position: absolute; font-family: 'Playfair Display', serif; font-style: italic; color: var(--ink);
    opacity: 0; animation-name: ambientFade; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
    will-change: opacity, transform;
  }
  @keyframes ambientFade {
    0% { opacity: 0; transform: translateY(10px); }
    50% { opacity: var(--peak, 0.05); transform: translateY(-10px); }
    100% { opacity: 0; transform: translateY(-24px); }
  }

  .theme-toggle, .view-toggle-inline {
    position: fixed; top: 1.2rem; z-index: 900;
    width: 34px; height: 34px; background: var(--bg-card); border: 1px solid var(--rule); border-radius: 6px;
    color: var(--ink-mute); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 150ms var(--ease-out), color 150ms var(--ease-out), background 150ms var(--ease-out);
    padding: 0;
  }
  .theme-toggle { right: 1.2rem; }
  .view-toggle-inline { right: calc(1.2rem + 42px); }
  .theme-toggle:hover, .view-toggle-inline:hover { border-color: var(--gold); color: var(--ink-dim); background: var(--gold-wash); }
  .theme-toggle:active, .view-toggle-inline:active { transform: scale(0.93); }

  .back-to-top {
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 900;
    width: 34px; height: 34px; background: var(--bg-card); border: 1px solid var(--rule); border-radius: 6px;
    color: var(--ink-mute); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    transition: border-color 150ms var(--ease-out), color 150ms var(--ease-out), background 150ms var(--ease-out), opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
    opacity: 0; pointer-events: none; transform: translateY(8px);
  }
  .back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .back-to-top:hover { border-color: var(--gold); color: var(--ink-dim); background: var(--gold-wash); }
  .back-to-top:active { transform: scale(0.93); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important; scroll-behavior: auto !important;
    }
  }

  .container { max-width: 960px; margin: 0 auto; padding: 0 18px; }

  .section-rule { display: flex; align-items: center; gap: 12px; margin: 40px 0 0; }
  .section-rule .label { display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink-mute); white-space: nowrap; font-weight: 500; }
  .section-rule .gold-mark { color: var(--gold); margin-right: 8px; font-size: 10px; }
  .section-rule::before, .section-rule::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

  .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; border: 1px solid var(--rule); color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; background: transparent; display: inline-block; }

  /* ── MASTHEAD ───────────────────────────────────── */
  .masthead { border-bottom: 3px double var(--ink); padding: 48px 24px 0; text-align: center; }
  .masthead::before { content: '✦ ✦ ✦'; display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.6em; color: var(--ink-mute); margin-bottom: 18px; }
  .masthead-title { font-size: clamp(48px, 11vw, 92px); font-weight: 900; letter-spacing: -0.03em; line-height: 0.9; display: inline-block; }
  .masthead-title .psyche { font-style: italic; font-weight: 700; }
  .masthead-title .arch { font-style: normal; font-weight: 400; font-size: 0.45em; display: block; letter-spacing: 0.42em; color: var(--ink-dim); margin-top: 8px; text-transform: uppercase; }
  .masthead-rule {
    width: 100%; max-width: 680px; height: 2px; background: var(--gold); margin: 24px auto 0;
    clip-path: inset(0 100% 0 0); animation: reveal 700ms var(--ease-in-out) 150ms both;
  }
  @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
  .masthead-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); letter-spacing: 0.2em; text-transform: uppercase; padding: 16px 0 22px; opacity: 0; animation: fadeIn 400ms var(--ease-out) 500ms forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ── DATELINE ───────────────────────────────────── */
  .dateline { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px; border-bottom: 1px solid var(--rule); }
  .dateline span { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.14em; text-transform: uppercase; }
  .dateline .count { color: var(--gold); font-weight: 500; }
  .dateline-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .volume-nav { display: flex; align-items: center; gap: 10px; }
  .vol-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); background: transparent; border: none; cursor: pointer; padding: 2px; transition: color 150ms var(--ease-out); }
  .vol-btn:hover:not(:disabled) { color: var(--gold); }
  .vol-btn:active:not(:disabled) { transform: scale(0.9); }
  .vol-btn:disabled { opacity: 0.2; cursor: default; }

  @media (max-width: 560px) {
    .dateline { flex-direction: column; align-items: flex-start; gap: 8px; }
    .dateline-right { align-items: flex-start; }
  }

  /* ── BODY SWAP (mode transition) ─────────────────── */
  .body-wrap { transition: filter 200ms ease, opacity 200ms ease; }
  .body-wrap.is-swapping { filter: blur(2px); opacity: 0.55; }

  /* ── CARD GRID ──────────────────────────────────── */
  .entries-wrap { margin-top: 24px; overflow: hidden; }
  .entries-wrap[data-anim="next"] .cards, .entries-wrap[data-anim="next"] .timeline-view { animation: slideFromRight 280ms var(--ease-out) both; }
  .entries-wrap[data-anim="prev"] .cards, .entries-wrap[data-anim="prev"] .timeline-view { animation: slideFromLeft 280ms var(--ease-out) both; }
  .entries-wrap[data-anim="toggle"] .cards, .entries-wrap[data-anim="toggle"] .timeline-view { animation: fadeUp 280ms var(--ease-out) both; }
  @keyframes slideFromRight { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideFromLeft { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .cards { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 600px) { .cards { grid-template-columns: 1fr 1fr; gap: 10px; } .card--featured { grid-column: 1 / -1; } }

  .card {
    position: relative; overflow: hidden; display: block;
    border: 1px solid var(--rule);
    text-decoration: none; background: var(--bg-card);
    transition: transform 160ms var(--ease-out);
    opacity: 0; animation: cardIn 340ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 45ms);
    --tiltX: 0deg; --tiltY: 0deg;
    min-width: 0;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card-rim {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(220px circle at var(--glowX, 50%) var(--glowY, 50%), color-mix(in srgb, var(--accent, var(--gold)) 40%, transparent), transparent 62%);
    mix-blend-mode: soft-light;
    transition: opacity 220ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .card.tilting { transform: perspective(760px) rotateX(var(--tiltX)) rotateY(var(--tiltY)) translateX(4px); transition: transform 110ms var(--ease-out); }
    .card.tilting .card-rim { opacity: 0.85; }
    .card:hover .card-arrow { transform: translateX(4px); opacity: 1; }
  }
  .card:active { transform: scale(0.99); transition-duration: 90ms; }

  .card-body { padding: 30px 22px 26px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .card-main { min-width: 0; }
  .card-category {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
    color: color-mix(in srgb, var(--accent, var(--gold)) 55%, var(--ink) 45%);
    background: color-mix(in srgb, var(--accent, var(--gold)) 20%, var(--bg-card));
    display: inline-block; max-width: 100%; padding: 4px 9px; margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-title { font-size: clamp(19px, 3.6vw, 26px); font-weight: 700; line-height: 1.15; margin-bottom: 9px; letter-spacing: -0.01em; }
  .card--featured .card-title { font-size: clamp(26px, 4vw, 38px); }
  .card-desc { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-dim); line-height: 1.6; max-width: 540px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
  .card-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .card-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); line-height: 1.5; display: flex; flex-direction: column; align-items: flex-end; }
  .card-date-l1, .card-date-l2 { display: block; }
  .card-glyph { font-size: 26px; opacity: 0.7; }
  .card-arrow { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink-mute); opacity: 0.5; margin-top: auto; transition: transform 160ms var(--ease-out), opacity 160ms var(--ease-out); }

  /* ── TIMELINE ───────────────────────────────────── */
  .timeline-view { max-width: 660px; margin: 0 auto; padding: 0 1.4rem 3rem 1rem; position: relative; }
  .timeline-view::before { content: ''; position: absolute; left: calc(1rem + 1.5rem); top: 0; bottom: 0; width: 1px; background: var(--rule); }
  .timeline-item { display: grid; grid-template-columns: 3rem 1fr; gap: 0 1rem; padding-bottom: 1.4rem; text-decoration: none; opacity: 0; animation: cardIn 340ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 45ms); }
  .timeline-icon { font-size: 1.05rem; position: relative; z-index: 1; background: var(--bg); padding: 10px 4px; text-align: center; }
  .timeline-date { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; padding-top: 10px; margin-bottom: 0.4rem; }
  .timeline-card { background: var(--bg-card); border: 1px solid var(--rule); padding: 0.85rem 1.05rem; transition: transform 160ms var(--ease-out), background 200ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .timeline-item:hover .timeline-card { transform: translateX(3px); background: color-mix(in srgb, var(--accent, var(--gold)) 7%, var(--bg-card)); } }
  .timeline-title { font-size: 1.05rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.28rem; }
  .timeline-subtitle { font-family: 'EB Garamond', Georgia, serif; font-size: 0.88rem; color: var(--ink-dim); font-style: italic; line-height: 1.5; margin-bottom: 0.4rem; }
  .timeline-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }

  /* ── BOTTOM VOLUME NAV ──────────────────────────── */
  .bottom-vol-nav { display: flex; justify-content: center; padding: 20px 24px; margin-top: 28px; }
  .bottom-vol-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); background: var(--bg-card); border: 1px solid var(--rule); padding: 8px 20px; cursor: pointer; transition: color 150ms var(--ease-out), border-color 150ms var(--ease-out), background 150ms var(--ease-out); }
  .bottom-vol-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--gold); background: var(--gold-wash); }
  .bottom-vol-btn:active:not(:disabled) { transform: scale(0.97); }
  .bottom-vol-btn:disabled { color: var(--ink-mute); cursor: default; background: transparent; }
  .bottom-vol-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: var(--gold); min-width: 56px; background: var(--bg); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 8px 20px; display: flex; align-items: center; justify-content: center; }

  /* ── MODE SWITCH — floating, fixed bottom (Arquivo ⇄ Dossiê) ── */
  .mode-switch {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 950;
    display: flex; align-items: center; gap: 2px; padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: 'JetBrains Mono', monospace;
  }
  .mode-switch-highlight {
    position: absolute; top: 4px; left: 0; height: 32px; border-radius: 999px;
    background: var(--gold); will-change: transform, width;
  }
  .mode-switch[data-ready] .mode-switch-highlight { transition: transform 250ms var(--ease-out), width 250ms var(--ease-out); }
  .mode-switch-btn {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent;
    color: rgba(255, 255, 255, 0.55); font: inherit; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: color 150ms var(--ease-out);
  }
  .mode-switch-btn:hover { color: rgba(255, 255, 255, 0.85); }
  .mode-switch-btn:active { transform: scale(0.96); }
  .mode-switch-btn[data-active] { color: #16130e; }
  .mode-switch-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.14); }
  .mode-switch-replay {
    position: relative; z-index: 1; padding: 0 12px; height: 32px; font-size: 15px; color: rgba(255, 255, 255, 0.55);
    background: transparent; border: 0; border-radius: 999px; cursor: pointer; transition: color 150ms var(--ease-out);
  }
  .mode-switch-replay:hover { color: rgba(255, 255, 255, 0.9); }
  .mode-switch-replay.spinning { animation: replaySpin 450ms var(--ease-in-out); }
  @keyframes replaySpin { to { transform: rotate(360deg); } }

  /* ── DOSSIER BODY ─────────────────────────────────── */
  .ds-filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 24px; padding: 10px 14px; border: 1px solid var(--rule); background: var(--bg-card); transition: border-color 180ms var(--ease-out); }
  .ds-filterbar:focus-within { border-color: var(--gold); }
  .ds-search-row, .ds-filter-meta { display: contents; }
  .ds-filter-icon { font-family: 'JetBrains Mono', monospace; color: var(--ink-mute); font-size: 13px; }
  .ds-filter-input { flex: 1; min-width: 120px; border: none; background: transparent; outline: none; color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.02em; }
  .ds-filter-input::placeholder { color: var(--ink-mute); }
  .ds-filter-count { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--gold); white-space: nowrap; transition: transform 120ms var(--ease-out); }
  .ds-filter-count[data-pulse] { transform: scale(0.94); }
  .ds-scope-toggle {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-mute); background: transparent; border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer; white-space: nowrap;
    transition: color 150ms var(--ease-out), border-color 150ms var(--ease-out), background 150ms var(--ease-out);
  }
  .ds-scope-toggle:hover { color: var(--ink-dim); border-color: var(--gold); background: var(--gold-wash); }
  .ds-scope-toggle:active { transform: scale(0.96); }
  .ds-scope-toggle[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); background: var(--gold-wash); }

  .ds-catalog { margin-top: 6px; border-top: 1px solid var(--rule); }
  .ds-row { display: block; border-bottom: 1px solid var(--rule); text-decoration: none; padding: 12px 4px; opacity: 0; animation: rowIn 260ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 28ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .ds-row[data-hidden] { display: none; }
  .ds-row-main { display: grid; grid-template-columns: 92px 22px 1fr; align-items: baseline; gap: 12px; }
  .ds-row-date { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent, var(--gold)); letter-spacing: 0.06em; }
  .ds-row-icon { font-size: 14px; opacity: 0.75; }
  .ds-row-title { font-family: 'Playfair Display', serif; font-size: 16.5px; font-weight: 700; line-height: 1.3; transition: color 160ms var(--ease-out); }
  .ds-row-cats { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--ink-mute); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 3px; }
  .ds-row-vol { color: var(--accent, var(--gold)); }
  @media (hover: hover) and (pointer: fine) { .ds-row:hover .ds-row-title { color: var(--gold); } }
  .ds-row-detail { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 200ms var(--ease-out), opacity 180ms var(--ease-out); }
  .ds-row.is-open .ds-row-detail { opacity: 1; }
  .ds-row-detail-inner { padding: 10px 0 2px 138px; }
  .ds-row-sub { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 13.5px; color: var(--ink-dim); line-height: 1.55; max-width: 520px; }
  .ds-row-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ds-empty { padding: 30px 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-mute); text-align: center; }

  /* ── UPCOMING & FOOTER ────────────────────────────── */
  .upcoming { margin-top: 20px; padding: 22px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .upcoming-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-mute); letter-spacing: 0.32em; text-transform: uppercase; margin-bottom: 14px; }
  .upcoming-item { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-mute); display: flex; gap: 10px; margin-bottom: 8px; }
  .upcoming-item::before { content: '—'; opacity: 0.4; }
  .upcoming-item em { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--ink-dim); }

  footer { margin-top: 48px; padding: 24px; text-align: center; border-top: 3px double var(--ink); }
  footer p { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase; line-height: 1.9; }
  footer .sig { font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: var(--ink-dim); letter-spacing: 0; text-transform: none; display: block; margin-top: 6px; }
  .footer-icon { display: block; width: 120px; opacity: 0.35; margin: 20px auto 0; transition: filter 0.2s ease; }
  html.dark .footer-icon { filter: invert(1); }
  .footer-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 380px; margin: 20px auto 0; }

  }

  function wireArquivo() {
    wireCardExtras(document.querySelector('[data-body]'));
  }

  /* ══════════════════════════════════════════════════
     DOSSIER — busca + catálogo denso
     ══════════════════════════════════════════════════ */
  function matches(entry, q) {
    if (!q) return true;
    var hay = [entry.title, entry.subtitle, entry.date_display].concat(entry.categories, entry.tags).join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function dsRow(entry, i) {
    var accent = THEME_ACCENTS[entry.theme] || THEME_ACCENTS.identidade;
    var cats = entry.categories.map(esc).join(' · ');
    var volTag = dossierAllVolumes ? ' · <span class="ds-row-vol">VOL. ' + toRoman(entry.volume) + '</span>' : '';
    var tags = entry.tags.map(function (t) { return '<span class="tag">' + parseMarkup(t) + '</span>'; }).join('');
    var hidden = matches(entry, query) ? '' : ' data-hidden';
    return '' +
      '<a class="ds-row" href="' + entry.file + '" style="--accent:' + accent + '; --i:' + i + '"' + hidden + '>' +
        '<div class="ds-row-main">' +
          '<div class="ds-row-date">' + esc(entry.date_display.toUpperCase()) + '</div>' +
          '<div class="ds-row-icon">' + entry.icon + '</div>' +
          '<div><div class="ds-row-title">' + parseMarkup(entry.title) + '</div><div class="ds-row-cats">' + cats + volTag + '</div></div>' +
        '</div>' +
        '<div class="ds-row-detail"><div class="ds-row-detail-inner">' +
          '<div class="ds-row-sub">' + parseMarkup(entry.subtitle) + '</div>' +
          '<div class="ds-row-tags">' + tags + '</div>' +
        '</div></div>' +
      '</a>';
  }

  function dsCatalog() {
    var source = dossierAllVolumes ? getPublishedAll() : getPublished(vol);
    var entries = source.slice().sort(function (a, b) { return parseDate(a.date) - parseDate(b.date); });
    var visible = entries.filter(function (e) { return matches(e, query); }).length;
    var rowsHtml = entries.map(dsRow).join('');
    var emptyHtml = visible === 0 ? '<div class="ds-empty" data-empty>nenhuma entrada corresponde à busca</div>' : '';
    return { html: rowsHtml + emptyHtml, total: entries.length, visible: visible };
  }

  function dossierBodyHtml() {
    var cat = dsCatalog();
    return '' +
      '<div class="ds-filterbar">' +
        '<div class="ds-search-row">' +
          '<span class="ds-filter-icon">⌕</span>' +
          '<input class="ds-filter-input" type="text" placeholder="buscar por título, categoria ou tag… ( / )" data-filter-input value="' + esc(query) + '">' +
        '</div>' +
        '<div class="ds-filter-meta">' +
          '<span class="ds-filter-count" data-ds-count>' + cat.visible + ' de ' + cat.total + '</span>' +
          '<button class="ds-scope-toggle" data-scope-toggle aria-pressed="' + (dossierAllVolumes ? 'true' : 'false') + '">✦ todos os volumes</button>' +
        '</div>' +
      '</div>' +
      '<div class="ds-catalog" data-catalog>' + cat.html + '</div>';
  }

  var dsTouchOpenRow = null;
  function dsCloseRow(r) {
    var d = r.querySelector('.ds-row-detail');
    d.style.maxHeight = '0px';
    r.classList.remove('is-open');
    if (dsTouchOpenRow === r) dsTouchOpenRow = null;
  }
  function dsOpenRow(r) {
    if (dsTouchOpenRow && dsTouchOpenRow !== r) dsCloseRow(dsTouchOpenRow);
    var d = r.querySelector('.ds-row-detail');
    d.style.maxHeight = d.scrollHeight + 'px';
    r.classList.add('is-open');
    dsTouchOpenRow = r;
  }

  /* mobile: hold on a row to preview it (mirrors desktop hover); a quick tap still navigates */
  function wireLongPress(r) {
    var pressTimer = null, longPressed = false, startX = 0, startY = 0;
    r.addEventListener('touchstart', function (e) {
      longPressed = false;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      pressTimer = setTimeout(function () {
        longPressed = true;
        if (navigator.vibrate) navigator.vibrate(8);
        if (dsTouchOpenRow === r) dsCloseRow(r); else dsOpenRow(r);
      }, 420);
    }, { passive: true });
    r.addEventListener('touchmove', function (e) {
      var dx = Math.abs(e.touches[0].clientX - startX), dy = Math.abs(e.touches[0].clientY - startY);
      if (dx > 10 || dy > 10) clearTimeout(pressTimer);
    }, { passive: true });
    r.addEventListener('touchend', function (e) {
      clearTimeout(pressTimer);
      if (longPressed) e.preventDefault();
    });
    r.addEventListener('touchcancel', function () { clearTimeout(pressTimer); });
  }

  function dsWireRows() {
    dsTouchOpenRow = null;
    document.querySelectorAll('.ds-row').forEach(function (r) {
      r.addEventListener('mouseenter', function () { var d = r.querySelector('.ds-row-detail'); d.style.maxHeight = d.scrollHeight + 'px'; r.classList.add('is-open'); });
      r.addEventListener('mouseleave', function () { var d = r.querySelector('.ds-row-detail'); d.style.maxHeight = '0px'; r.classList.remove('is-open'); });
      wireLongPress(r);
    });
  }

  function dsRefreshCatalog() {
    var cat = dsCatalog();
    document.querySelector('[data-catalog]').innerHTML = cat.html;
    var countEl = document.querySelector('[data-ds-count]');
    countEl.textContent = cat.visible + ' de ' + cat.total;
    countEl.setAttribute('data-pulse', '');
    setTimeout(function () { countEl.removeAttribute('data-pulse'); }, 120);
    dsWireRows();
    if (window.applyRedact) window.applyRedact(); highlightTP();
  }

  function wireDossier() {
    dsWireRows();
    var input = document.querySelector('[data-filter-input]');
    input.addEventListener('input', function () { query = input.value.trim().toLowerCase(); dsRefreshCatalog(); });
    var scopeBtn = document.querySelector('[data-scope-toggle]');
    scopeBtn.addEventListener('click', function () {
      dossierAllVolumes = !dossierAllVolumes;
      scopeBtn.setAttribute('aria-pressed', dossierAllVolumes ? 'true' : 'false');
      updateDatelineChrome();
      dsRefreshCatalog();
    });
  }

  /* ══════════════════════════════════════════════════
     SHARED SHELL — dateline, volume nav, mode switch
     ══════════════════════════════════════════════════ */
  function updateDatelineChrome() {
    var entries, label, atMin, atMax;
    if (mode === 'dossier' && dossierAllVolumes) {
      entries = getPublishedAll();
      label = 'Todos';
      atMin = true; atMax = true;
    } else {
      var vols = getAvailableVolumes();
      entries = getPublished(vol);
      label = 'Vol. ' + toRoman(vol);
      atMin = vol <= vols[0]; atMax = vol >= vols[vols.length - 1];
    }
    document.querySelectorAll('[data-vol-label], [data-vol-label-lg]').forEach(function (el) { el.textContent = label; });
    document.querySelector('[data-count]').textContent = entries.length + ' entradas publicadas';
    document.querySelector('[data-daterange]').textContent = getVolumeDateRange(entries);
    document.querySelectorAll('[data-vol-prev]').forEach(function (b) { b.disabled = atMin; });
    document.querySelectorAll('[data-vol-next]').forEach(function (b) { b.disabled = atMax; });
  }

  function renderBody() {
    var body = document.querySelector('[data-body]');
    if (mode === 'arquivo') {
      body.innerHTML = arquivoBodyHtml();
      wireArquivo();
    } else {
      body.innerHTML = dossierBodyHtml();
      wireDossier();
    }
    if (window.applyRedact) window.applyRedact(); highlightTP();
  }

  function switchVolume(dir) {
    var vols = getAvailableVolumes();
    var idx = vols.indexOf(vol);
    if (dir === 'next' && idx < vols.length - 1) vol = vols[idx + 1];
    else if (dir === 'prev' && idx > 0) vol = vols[idx - 1];
    else return;
    updateURLVolume(vol);
    updateDatelineChrome();
    if (mode === 'arquivo') {
      arquivoSwap(dir);
    } else {
      query = '';
      var body = document.querySelector('[data-body]');
      body.innerHTML = dossierBodyHtml();
      wireDossier();
      if (window.applyRedact) window.applyRedact(); highlightTP();
    }
  }

  function moveModeHighlight() {
    var switcher = document.querySelector('[data-mode-switch]');
    var active = switcher.querySelector('[data-active]');
    var hl = switcher.querySelector('.mode-switch-highlight');
    hl.style.width = active.offsetWidth + 'px';
    hl.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  }

  function switchMode(newMode) {
    if (newMode === mode) return;
    mode = newMode;
    document.querySelectorAll('[data-mode-btn]').forEach(function (b) {
      var isActive = b.getAttribute('data-mode-btn') === mode;
      b.toggleAttribute('data-active', isActive);
      if (isActive) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
    moveModeHighlight();
    document.getElementById('view-toggle').style.display = mode === 'arquivo' ? '' : 'none';
    updateDatelineChrome();
    var body = document.querySelector('[data-body]');
    body.classList.add('is-swapping');
    setTimeout(function () {
      renderBody();
      body.classList.remove('is-swapping');
    }, 190);
  }

  /* ── init ─────────────────────────────────────────── */
  var isDark = localStorage.getItem('psyches_v2_theme') !== 'light';
  function applyTheme() {
    document.documentElement.classList.toggle('dark', isDark);
    document.getElementById('theme-toggle').innerHTML = isDark ? ICON_SUN : ICON_MOON;
  }
  document.getElementById('theme-toggle').addEventListener('click', function () {
    isDark = !isDark;
    localStorage.setItem('psyches_v2_theme', isDark ? 'dark' : 'light');
    applyTheme();
  });

  document.getElementById('view-toggle').innerHTML = timeline ? ICON_GRID : ICON_TIMELINE;
  document.getElementById('view-toggle').addEventListener('click', function () {
    timeline = !timeline;
    localStorage.setItem('psyches_v2_view', timeline ? 'timeline' : 'grid');
    document.getElementById('view-toggle').innerHTML = timeline ? ICON_GRID : ICON_TIMELINE;
    arquivoSwap('toggle');
  });

  document.querySelectorAll('[data-vol-prev]').forEach(function (b) { b.addEventListener('click', function () { switchVolume('prev'); }); });
  document.querySelectorAll('[data-vol-next]').forEach(function (b) { b.addEventListener('click', function () { switchVolume('next'); }); });
  document.querySelectorAll('[data-mode-btn]').forEach(function (b) { b.addEventListener('click', function () { switchMode(b.getAttribute('data-mode-btn')); }); });

  function replayCurrent() {
    var btn = document.querySelector('[data-replay]');
    btn.classList.remove('spinning');
    void btn.offsetWidth; /* restart the spin animation even on rapid re-clicks */
    btn.classList.add('spinning');
    renderBody();
  }
  function scrollToTop() { window.scrollTo({ top: 0, behavior: prefersReduced ? 'auto' : 'smooth' }); }

  /* on mobile the floating back-to-top button collides with the mode-switch pill, so its job moves
     into the pill's replay button — which is a rarely-used desktop-only affordance anyway */
  var mobileMedia = window.matchMedia('(max-width: 599px)');
  function updateReplayButton() {
    var btn = document.querySelector('[data-replay]');
    if (mobileMedia.matches) {
      btn.innerHTML = ICON_TOP;
      btn.setAttribute('aria-label', 'Voltar ao topo');
    } else {
      btn.innerHTML = '↻';
      btn.setAttribute('aria-label', 'Recarregar animação (R)');
    }
  }
  document.querySelector('[data-replay]').addEventListener('click', function () {
    if (mobileMedia.matches) scrollToTop(); else replayCurrent();
  });
  if (mobileMedia.addEventListener) mobileMedia.addEventListener('change', updateReplayButton);
  else mobileMedia.addListener(updateReplayButton);
  updateReplayButton();

  document.getElementById('back-to-top').addEventListener('click', scrollToTop);
  window.addEventListener('scroll', function () {
    document.getElementById('back-to-top').classList.toggle('visible', window.scrollY > 300);
  });

  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') {
      e.preventDefault();
      var needsSwitch = mode !== 'dossier';
      if (needsSwitch) switchMode('dossier');
      setTimeout(function () { var i = document.querySelector('[data-filter-input]'); if (i) i.focus(); }, needsSwitch ? 210 : 0);
    } else if (e.key === 'r' || e.key === 'R') {
      if (mobileMedia.matches) scrollToTop(); else replayCurrent();
    }
  });

  applyTheme();
  updateURLVolume(vol);
  updateDatelineChrome();
  renderBody();
  moveModeHighlight();
  requestAnimationFrame(function () { requestAnimationFrame(function () { document.querySelector('[data-mode-switch]').setAttribute('data-ready', ''); }); });
  window.addEventListener('resize', moveModeHighlight);

})();
</script>
</body>
</html>
